name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede in-flight runs for the same ref so a cancelled job means "a newer commit
# replaced this run", not "something died mid-step". Pushes to main are never
# cancelled: main's history is the release gate and every commit needs its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      # Upload compiled output from Node 22 for downstream jobs
      - name: Upload compiled output
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v7
        with:
          name: compiled-output
          retention-days: 1
          path: |
            packages/ecl-core/src/parser/generated/
            packages/ecl-core/dist/
            packages/ecl-lsp-server/dist/
            packages/ecl-editor-core/dist/
            packages/ecl-editor-react/dist/
            packages/ecl-editor/dist/
            clients/vscode/dist/

      # Package npm tarballs + VSCode VSIX from Node 22 (no separate package job needed)
      - name: Pack npm packages
        if: matrix.node-version == 22
        run: |
          for pkg in ecl-core ecl-lsp-server ecl-editor-core ecl-editor-react ecl-editor; do
            (cd packages/$pkg && npm pack)
          done
          mkdir -p artifacts/npm-packages
          find packages/ -maxdepth 2 -name '*.tgz' -exec cp {} artifacts/npm-packages/ \;

      - name: Build VSCode VSIX
        if: matrix.node-version == 22
        working-directory: clients/vscode
        run: npm run build:vsix

      - name: Upload npm packages
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: artifacts/npm-packages/

      - name: Upload VSCode extension
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: clients/vscode/*.vsix

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm audit — check for known vulnerabilities in production dependencies
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

      # Dependency vulnerability scan (npm + Gradle lockfiles)
      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: 1

      # Secret scanning (leaked keys, tokens, passwords)
      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: secret
          exit-code: 1

      # License compliance (Apache 2.0 — block copyleft)
      - name: Trivy license scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: license
          severity: CRITICAL,HIGH
          exit-code: 1
          trivy-config: trivy.yaml

      # SAST — static analysis for code-level vulnerabilities
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/typescript
            p/owasp-top-ten
            p/security-audit

  licenses:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check THIRD-PARTY-LICENSES.txt is up to date
        run: npm run licenses:check

  e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    # The job normally finishes in about 5 minutes. Without a cap, a hung browser
    # download ran until the runner was reclaimed and surfaced as "cancelled",
    # which is indistinguishable from a deliberate cancellation.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download compiled output
        uses: actions/download-artifact@v8
        with:
          name: compiled-output

      # Key the cache on the resolved @playwright/test version, not on the lockfile
      # hash: browser builds track Playwright's version, so keying on the lockfile
      # would evict them on every unrelated dependency bump.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Split from the browser download: system packages live outside
      # ~/.cache/ms-playwright so the cache cannot cover them, and they must be
      # installed on every run. This is the apt-get step, and it is the one that hung.
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: npx playwright install-deps chromium

      # Skipped entirely on a cache hit, which is where the time is saved.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install chromium

      - name: Run E2E tests
        timeout-minutes: 15
        run: npm run test:e2e

  intellij-plugin:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download compiled output
        uses: actions/download-artifact@v8
        with:
          name: compiled-output

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test IntelliJ plugin
        working-directory: clients/intellij
        run: ./gradlew build

      - name: Package IntelliJ plugin
        working-directory: clients/intellij
        run: ./gradlew buildPlugin

      - name: Upload IntelliJ plugin
        uses: actions/upload-artifact@v7
        with:
          name: intellij-plugin
          path: clients/intellij/build/distributions/*.zip

  eclipse-plugin:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download compiled output
        uses: actions/download-artifact@v8
        with:
          name: compiled-output

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('clients/eclipse/**/pom.xml', 'clients/eclipse/**/*.target') }}
          restore-keys: maven-

      - name: Build and test Eclipse plugin
        working-directory: clients/eclipse
        run: xvfb-run mvn clean verify

      - name: Upload Eclipse update site
        uses: actions/upload-artifact@v7
        with:
          name: eclipse-updatesite
          path: clients/eclipse/au.csiro.ecl.eclipse.updatesite/target/*.zip
