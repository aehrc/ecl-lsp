name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  # ── Validate ────────────────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check third-party licenses
        run: npm run licenses:check

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # The publish job takes the version from package.json, but rewrites
      # workspace dependency ranges from the tag. If the two disagree we would
      # publish mismatched metadata, so fail here rather than at publish time.
      - name: Verify package versions match the tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          STATUS=0
          for f in package.json clients/vscode/package.json packages/*/package.json; do
            PKG_VERSION="$(node -p "require('./$f').version")"
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "::error file=$f::version is $PKG_VERSION but the tag is v$VERSION"
              STATUS=1
            fi
          done
          if [ "$STATUS" -ne 0 ]; then
            echo "Bump every package.json to $VERSION and re-tag."
          fi
          exit "$STATUS"

      # Upload compiled output for downstream jobs
      - name: Upload compiled output
        uses: actions/upload-artifact@v7
        with:
          name: compiled-output
          retention-days: 1
          path: |
            packages/ecl-core/src/parser/generated/
            packages/ecl-core/dist/
            packages/ecl-lsp-server/dist/
            packages/ecl-editor-core/dist/
            packages/ecl-editor-react/dist/
            packages/ecl-editor/dist/
            clients/vscode/dist/

    outputs:
      version: ${{ steps.version.outputs.version }}

  # ── npm publish ─────────────────────────────────────────────────────
  npm-publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Repair and upgrade npm for OIDC publishing
        run: |
          # The pre-installed npm on Node 22.22.2 is broken (missing promise-retry).
          # Use corepack to get a working npm, then upgrade properly.
          corepack enable npm
          corepack install -g npm@11

      - run: npm ci

      - name: Download compiled output
        uses: actions/download-artifact@v8
        with:
          name: compiled-output

      - name: Rewrite workspace refs to registry versions
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          for pkg in ecl-core ecl-lsp-server ecl-editor-core ecl-editor-react ecl-editor; do
            sed -i "s|\"file:../ecl-core\"|\"^$VERSION\"|g" "packages/$pkg/package.json"
            sed -i "s|\"file:../ecl-editor-core\"|\"^$VERSION\"|g" "packages/$pkg/package.json"
          done

      # A publish failure used to be swallowed by `|| true`, so the job went green
      # having published nothing. Now every package is still attempted, but a real
      # failure fails the job. A version already present on the registry is treated
      # as success so the workflow stays re-runnable after a partial failure.
      - name: Publish npm packages
        run: |
          STATUS=0
          for pkg in ecl-core ecl-lsp-server ecl-editor-core ecl-editor-react ecl-editor; do
            PKG_NAME="$(node -p "require('./packages/$pkg/package.json').name")"
            PKG_VERSION="$(node -p "require('./packages/$pkg/package.json').version")"
            if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
              echo "::notice::$PKG_NAME@$PKG_VERSION is already published, skipping"
              continue
            fi
            if (cd "packages/$pkg" && npm publish --access public --provenance); then
              echo "published $PKG_NAME@$PKG_VERSION"
            else
              echo "::error::failed to publish $PKG_NAME@$PKG_VERSION"
              STATUS=1
            fi
          done
          exit "$STATUS"

      - name: Pack npm tarballs
        run: |
          mkdir -p release-artifacts
          for pkg in ecl-core ecl-lsp-server ecl-editor-core ecl-editor-react ecl-editor; do
            (cd packages/$pkg && npm pack --pack-destination ../../release-artifacts/)
          done

      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: release-artifacts/

  # ── VSCode extension ────────────────────────────────────────────────
  vscode-extension:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download compiled output
        uses: actions/download-artifact@v8
        with:
          name: compiled-output

      - name: Build VSIX
        working-directory: clients/vscode
        run: npm run build:vsix

      - uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: clients/vscode/*.vsix

  # ── IntelliJ plugin ─────────────────────────────────────────────────
  intellij-plugin:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download compiled output
        uses: actions/download-artifact@v8
        with:
          name: compiled-output

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      # Version comes from the tag so the artifact filename matches the release
      # rather than whatever is committed in gradle.properties.
      - name: Build IntelliJ plugin
        working-directory: clients/intellij
        run: ./gradlew buildPlugin -PpluginVersion="${GITHUB_REF#refs/tags/v}"

      - uses: actions/upload-artifact@v7
        with:
          name: intellij-plugin
          path: clients/intellij/build/distributions/*.zip

  # ── Eclipse plugin ──────────────────────────────────────────────────
  eclipse-plugin:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download compiled output
        uses: actions/download-artifact@v8
        with:
          name: compiled-output

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('clients/eclipse/**/pom.xml', 'clients/eclipse/**/*.target') }}
          restore-keys: maven-

      # Tycho reads the version from the poms and MANIFEST.MFs, so set them from
      # the tag first; otherwise the update site zip carries the committed
      # -SNAPSHOT version instead of the release version.
      - name: Set Eclipse plugin version from tag
        working-directory: clients/eclipse
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Read Tycho's version from .mvn/maven.config so a Tycho bump does not
          # silently leave this pinned to an older plugin.
          TYCHO=$(grep -oE 'tycho\.version=[0-9.]+' .mvn/maven.config | cut -d= -f2)
          echo "Using Tycho $TYCHO to set version $VERSION"
          mvn -B "org.eclipse.tycho:tycho-versions-plugin:${TYCHO}:set-version" -DnewVersion="$VERSION"

      - name: Build Eclipse update site
        working-directory: clients/eclipse
        run: xvfb-run mvn clean verify -DskipTests

      - uses: actions/upload-artifact@v7
        with:
          name: eclipse-updatesite
          path: clients/eclipse/au.csiro.ecl.eclipse.updatesite/target/*.zip

  # ── Docker image ────────────────────────────────────────────────────
  docker-image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ontoserver.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Slack bot Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/ecl-slack-bot/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ontoserver.azurecr.io/ecl-slack-bot:${{ needs.validate.outputs.version }}
            ontoserver.azurecr.io/ecl-slack-bot:latest

  # ── GitHub Release ──────────────────────────────────────────────────
  github-release:
    needs: [validate, npm-publish, vscode-extension, intellij-plugin, eclipse-plugin, docker-image]
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: artifacts/npm-packages
        continue-on-error: true
      - uses: actions/download-artifact@v8
        with:
          name: vscode-extension
          path: artifacts/vscode-extension
        continue-on-error: true
      - uses: actions/download-artifact@v8
        with:
          name: intellij-plugin
          path: artifacts/intellij-plugin
        continue-on-error: true
      - uses: actions/download-artifact@v8
        with:
          name: eclipse-updatesite
          path: artifacts/eclipse-updatesite
        continue-on-error: true

      - name: Collect release files
        run: |
          mkdir -p release-artifacts
          cp artifacts/npm-packages/* release-artifacts/ 2>/dev/null || true
          cp artifacts/vscode-extension/* release-artifacts/ 2>/dev/null || true
          cp artifacts/intellij-plugin/* release-artifacts/ 2>/dev/null || true
          cp artifacts/eclipse-updatesite/* release-artifacts/ 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-artifacts/*
